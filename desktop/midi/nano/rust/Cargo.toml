[package]
name = "rust_lib_nano"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
log = "0.4"
nano-backend = { version = "*", path = "../../nano-backend" }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
